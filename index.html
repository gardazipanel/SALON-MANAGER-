<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salon Manager Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0f8;--cd:#fff;--tx:#0f1630;--mu:#5f6987;--bd:#e0e5f1;--ac:#0aa563;--g:#0aa563;--b:#1b8cff;--or:#ee8a10;--rd:#e0342a;--pk:#c2386f}
:root[data-theme="dark"]{--bg:#0b1020;--cd:#161c30;--tx:#eef1ff;--mu:#9aa4c8;--bd:#262d48}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:14px 14px 92px;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
.f,h1,h2,h3,.nav a,.b,.chip,.tag{font-family:Oswald,"Roboto Condensed",sans-serif-condensed,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em}
h1{font-size:30px;line-height:1.05;margin:0;font-weight:700}h2{font-size:14px;margin:16px 0 6px;color:var(--mu);font-weight:600}h3{font-size:14px;margin:0;font-weight:600}
small,.mu{color:var(--mu);font-size:11.5px}.sm{font-family:Oswald,"Roboto Condensed",sans-serif-condensed,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}.top .bt{display:flex;gap:7px}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:var(--cd);color:var(--tx);display:inline-grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px #1a284a14}.ib.on{background:var(--ac);color:#fff}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hero{display:flex;gap:10px;align-items:center;border-radius:20px;padding:12px;color:#fff;box-shadow:0 6px 16px #0a63d622}
.hero .ico{width:38px;height:38px;border-radius:12px;background:#ffffff30;display:grid;place-items:center;flex:none}.hero .lb{font-size:12.5px;opacity:.95}.hero .vl{font-size:24px;font-weight:700;line-height:1.1}.hero .sb{font-size:10.5px;opacity:.9}
.hg{background:linear-gradient(135deg,#0aa563,#07804e)}.hb{background:linear-gradient(135deg,#1b8cff,#0a63d6)}
.tile{background:var(--cd);border:1px solid var(--bd);border-top:4px solid var(--c);border-radius:20px;padding:10px 12px}.tile .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:6px}.tile .lb{font-size:12.5px;color:var(--mu)}.tile .vl{font-size:22px;font-weight:700}
.b{border:0;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#0aa563,#07804e);color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none}
.b.f2{width:100%;margin-top:10px}.b.gh{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.b.bl{background:linear-gradient(135deg,#1b8cff,#0a63d6)}.b.r{background:var(--rd)}.b.s{padding:6px 11px;font-size:12.5px}
.lk{background:none;border:0;color:var(--rd);cursor:pointer;padding:4px;display:inline-flex}
input,select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:13px system-ui;margin-top:7px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--mu);border-radius:18px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tag{border-radius:8px;padding:2px 9px;font-size:11.5px;color:#fff}
.tok{font-size:18px;font-weight:700;color:var(--b)}
.svc{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1.5px solid var(--bd);border-radius:16px;margin-top:8px;background:var(--cd);cursor:pointer}
.svc.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 9%,var(--cd))}
.svc b{font-size:14px;font-weight:700}.svc small{display:block}.svc .p{margin-left:auto;font:700 17px Oswald,sans-serif-condensed,sans-serif;color:var(--g);white-space:nowrap}
.lks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}.lks a{display:inline-flex;gap:5px;align-items:center;text-decoration:none;color:#fff;border-radius:16px;padding:5px 11px;font:600 12px Oswald,sans-serif-condensed,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.bar{height:7px;border-radius:4px;background:var(--bd);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0aa563,#1b8cff)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;align-items:flex-end;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
.nav a{flex:1;color:var(--mu);font-size:11.5px;font-weight:600;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.nav a.on{color:var(--ac)}
.nav .ctr span{width:54px;height:54px;border-radius:50%;background:var(--cd);border:5px solid var(--bg);box-shadow:0 4px 14px #1a284a30;display:grid;place-items:center;color:var(--b);margin-top:-30px}
.sticky{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:auto;background:var(--tx);color:var(--bg);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font:700 16px Oswald,sans-serif-condensed,sans-serif;text-transform:uppercase}
details{background:var(--cd);border:1px solid var(--bd);border-radius:18px;margin-top:10px}summary{padding:12px;font:600 14px Oswald,sans-serif-condensed,sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;display:flex;gap:8px;align-items:center}details>div{padding:0 12px 12px}
.pst{display:block;margin:6px auto;max-width:290px;width:100%;height:auto;border-radius:18px;box-shadow:0 6px 20px #0003}
.ban{border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,#0aa563,#1b8cff)}.ban h1{font-size:28px}.ban small{color:#ffffffd0}
.tc{text-align:center}.tc .tok{font-size:38px}
#scan{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}#scan .sc{background:var(--cd);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:14px}#scan video{width:100%;border-radius:14px;background:#000;margin-top:10px;max-height:46vh;object-fit:cover}
.tile{position:relative}.go{position:absolute;top:11px;right:11px;color:var(--mu);display:inline-flex}.hero{position:relative}.hero .go{color:#fff;opacity:.85}
.hero:active,.tile:active,.li:active{transform:scale(.985)}
.list{background:var(--cd);border:1px solid var(--bd);border-radius:16px;overflow:hidden}.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer}.li:last-child{border:0}
.li .ti{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);display:grid;place-items:center;flex:none}.li b{font-size:14px}.li small{display:block}.li .go{position:static;margin-left:auto}

@media print{.nav,.top,.b,.ib{display:none!important}}</style></head><body>

const wa=(p,t)=>{let d=String(p||'').replace(/\D/g,'');if(d[0]==='0')d='92'+d.slice(1);return 'https://wa.me/'+d+(t?'?text='+encodeURIComponent(t):'')};
const net=p=>p.kind==='refund'?-p.amount:+p.amount;
function toast(m){const e=document.createElement('div');e.textContent=m;e.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;font-size:13px';document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
async function run(p){const r=await p;if(r.error){toast(r.error.message);return null}return r.data??true}
const view=h=>{$('#app').innerHTML=h;window.scrollTo(0,0)};
const tb=()=>`<button class="ib" onclick="theme(dark()?'light':'dark')" aria-label="Theme">${ic(dark()?'sun':'moon')}</button>`;
const head=(t,s)=>`<div class="top"><div><div class="sm">${s||''}</div><h1>${t}</h1></div><div class="bt">${tb()}${U?`<button class="ib" onclick="sb.auth.signOut().then(route)" aria-label="Logout">${ic('lock')}</button>`:''}</div></div>`;
const hero=(c,l,v,s)=>`<div class="hero ${c}"><div><div class="f lb">${l}</div><div class="f vl">${v}</div>${s?`<div class="f sb">${s}</div>`:''}</div></div>`;
const tile=(l,v,c)=>`<div class="tile" style="--c:${c}"><div class="f lb">${l}</div><div class="f vl">${v}</div></div>`;
const sel=(id,a,ph)=>`<select id="${id}"><option value="">${ph}</option>${a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`;
const SC={confirmed:'var(--b)',pending:'var(--or)',checked_in:'var(--pk)',completed:'var(--g)',cancelled:'var(--mu)'};

/* ===== routing ===== */
async function route(){const h=location.hash;
 if(h.startsWith('#/s/'))return pubPage(h.slice(4));
 if(h.startsWith('#/t/'))return ticketPage(h.slice(4));
 const{data:{session}}=await sb.auth.getSession();U=session&&session.user;if(!U)return authPage();
 const m=await run(sb.from('salon_members').select('role,salons(*)').eq('user_id',U.id).limit(1));
 if(!m)return;if(!m.length)return newSalon();
 SAL=m[0].salons;ROLE=m[0].role;CUR=SAL.currency;await refresh()}
addEventListener('hashchange',route);
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('New password (min 8 characters)');if(p&&p.length>=8)sb.auth.updateUser({password:p}).then(()=>toast('Password changed'))}});

/* ===== auth ===== */
function authPage(){view(`<div class="ban" style="margin-top:20px"><small class="f">Multi-salon platform</small><h1>Salon Manager Pro</h1><small>Online booking, QR tokens, staff, sales and expenses for your salon.</small></div><div class="card"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min 8)" autocomplete="current-password"><button class="b f2" onclick="auth('in')">Sign in</button><button class="b gh f2" onclick="auth('up')">Create salon account</button><button class="lk" style="color:var(--mu);margin-top:10px" onclick="auth('rs')">Forgot password?</button></div>`)}
async function auth(m){const email=$('#em').value.trim(),password=$('#pw').value;if(!email)return toast('Enter your email');
 if(m==='rs'){if(await run(sb.auth.resetPasswordForEmail(email,{redirectTo:base()})))toast('Reset link sent to your email');return}
 if(password.length<8)return toast('Password must be at least 8 characters');
 const r=m==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{emailRedirectTo:base()}});
 if(r.error)return toast(r.error.message);
 if(!r.data.session)return toast('Check your email to confirm your account');route()}
function newSalon(){view(head('Create your salon','Step 1')+`<div class="card"><input id="sn" placeholder="Salon name" oninput="$('#ss').value=this.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')"><input id="ss" placeholder="web-address (a-z, 0-9, -)"><small>Public page: ${esc(base())}#/s/<b>your-address</b></small><button class="b f2" onclick="mk()">Create salon</button></div>`)}
async function mk(){if(await run(sb.rpc('create_salon',{p_name:$('#sn').value,p_slug:$('#ss').value})))route()}

/* ===== data ===== */
async function refresh(){const q=(t,s)=>sb.from(t).select(s||'*').eq('salon_id',SAL.id).order('created_at',{ascending:false}).limit(1000);
 const r=await Promise.all([q('bookings','*,services(name),staff(name)'),q('services'),q('staff'),q('payments'),q('expenses')]);
 const e=r.find(x=>x.error);if(e)toast(e.error.message);
 [D.bk,D.sv,D.st,D.py,D.ex]=r.map(x=>x.data||[]);render()}
function render(){view(({home,bk:bookings,mg:manage,money}[tab]||home)()+nav())}
function nav(){return '<div class="nav">'+[['home','home','Home'],['bk','users','Bookings'],['scan','scan','Scan'],['mg','gear','Manage'],['money','wallet','Money']].map(x=>x[0]==='scan'?`<a class="ctr" onclick="scanOpen()"><span>${ic('scan',24)}</span>Scan</a>`:`<a class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';render()">${ic(x[1],21)}${x[2]}</a>`).join('')+'</div>'}
async function upd(t,id,o){if(await run(sb.from(t).update(o).eq('id',id)))refresh()}
async function del(t,id){if(confirm('Delete? This cannot be undone.')&&await run(sb.from(t).delete().eq('id',id)))refresh()}
async function ins(t,o){if(await run(sb.from(t).insert({salon_id:SAL.id,...o})))refresh()}

/* ===== dashboard (all numbers from DB rows) ===== */
function home(){const t0=day0(),m0=mon0(),bt=D.bk.filter(b=>{const t=+new Date(b.starts_at);return t>=t0&&t<t0+864e5}),c=s=>bt.filter(b=>s.includes(b.status)).length,
 ts=sum(D.py.filter(p=>+new Date(p.created_at)>=t0).map(net)),ms=sum(D.py.filter(p=>+new Date(p.created_at)>=m0).map(net)),
 mex=sum(D.ex.filter(e=>e.spent_on>=iso(m0)).map(e=>+e.amount)),first={},cnt={};
 D.bk.forEach(b=>{const t=+new Date(b.created_at);if(!(b.customer_phone in first)||t<first[b.customer_phone])first[b.customer_phone]=t;if(b.status!=='cancelled'){const n=b.services?.name||'?';cnt[n]=(cnt[n]||0)+1}});
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4),mx=top[0]?top[0][1]:1,
 days=[...Array(7)].map((_,i)=>{const a=t0-(6-i)*864e5;return{l:new Date(a).getDate(),v:sum(D.py.filter(p=>{const t=+new Date(p.created_at);return t>=a&&t<a+864e5}).map(net))}}),m=Math.max(1,...days.map(d=>d.v)),
 link=base()+'#/s/'+SAL.slug;
 return head(esc(SAL.name),'Dashboard')+`<div class="g2" style="margin-top:0">${hero('hg','Today sales',rs(ts))}${hero('hb','Net profit (month)',rs(ms-mex),'Revenue - expenses')}</div>
<div class="g2">${tile('Bookings today',bt.length,'var(--b)')}${tile('Completed',c(['completed']),'var(--g)')}${tile('Pending',c(['pending','confirmed','checked_in']),'var(--or)')}${tile('Cancelled',c(['cancelled']),'var(--rd)')}${tile('Month revenue',rs(ms),'var(--g)')}${tile('Month expenses',rs(mex),'var(--rd)')}${tile('Customers',Object.keys(first).length,'var(--b)')}${tile('New this month',Object.values(first).filter(t=>t>=m0).length,'var(--pk)')}${tile('Active staff',D.st.filter(s=>s.active).length,'var(--or)')}</div>
<div class="card"><h3>Last 7 days sales</h3><svg viewBox="0 0 300 90" width="100%">${days.map((d,i)=>`<rect x="${i*43+3}" y="${72-d.v/m*66}" width="37" height="${Math.max(1,d.v/m*66)}" rx="3" fill="#0aa563" opacity="${d.v?1:.25}"/><text x="${i*43+21}" y="86" text-anchor="middle" font-size="8" fill="var(--mu)">${d.l}</text>`).join('')}</svg></div>
<div class="card"><h3>Popular services</h3>${top.length?top.map(t=>`<div class="row" style="margin-top:7px"><span>${esc(t[0])}</span><b>${t[1]}</b></div><div class="bar"><i style="width:${t[1]/mx*100}%"></i></div>`).join(''):'<div class="mu">No bookings yet.</div>'}</div>
<div class="card"><h3>Your public booking link</h3><small style="word-break:break-all">${esc(link)}</small><button class="b f2" onclick="navigator.clipboard.writeText('${link}');toast('Link copied')">Copy link</button></div>
<h2>Recent bookings</h2>${D.bk.slice(0,5).map(bcard).join('')||'<div class="card mu">No bookings yet. Share your link or add a walk-in.</div>'}
<h2>Recent payments</h2>${D.py.slice(0,5).map(prow).join('')||'<div class="card mu">No payments yet.</div>'}`}
const prow=p=>{const b=D.bk.find(x=>x.id===p.booking_id);return `<div class="card row"><div><b>${esc(b?b.customer_name:'')}</b><div class="mu">${fmt(p.created_at)} · ${p.method}</div></div><b class="f" style="color:var(--g);font-size:17px">${rs(net(p))}</b></div>`};

/* ===== bookings ===== */
const paid=id=>sum(D.py.filter(p=>p.booking_id===id).map(net));
function bcard(b){const pd=paid(b.id),live=b.status!=='cancelled',bt=(s,l,cl)=>`<button class="b s ${cl||''}" onclick="setSt('${b.id}','${s}')">${l}</button>`;
 return `<div class="card"><div class="row"><span class="f tok">#${b.token_no} <small>${b.ref}</small></span><span class="tag" style="background:${SC[b.status]}">${b.status.replace('_',' ')}</span></div><div class="row"><b>${esc(b.customer_name)}</b><a class="mu" href="tel:${esc(b.customer_phone)}">${esc(b.customer_phone)}</a></div><div class="mu">${esc(b.services?.name)} · ${esc(b.staff?.name)} · ${fmt(b.starts_at)}</div>${b.notes?`<small>Note: ${esc(b.notes)}</small>`:''}<div class="mu" style="margin-top:4px">${rs(b.price)} · paid ${rs(pd)}${pd>=b.price?' ✓':''}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${['pending','confirmed'].includes(b.status)?bt('checked_in','Check-in'):''}${b.status==='checked_in'?bt('completed','Complete','bl'):''}${live&&pd<b.price?`<button class="b s bl" onclick="pay('${b.id}')">Record payment</button>`:''}${live&&b.status!=='completed'?bt('cancelled','Cancel','r'):''}<a class="b s gh" target="_blank" href="${wa(b.customer_phone,'Hi '+b.customer_name+', your booking '+b.ref+' at '+SAL.name+' is on '+fmt(b.starts_at)+'.')}">WhatsApp</a></div></div>`}
async function setSt(id,s){if(s==='cancelled'&&!confirm('Cancel this booking?'))return;if(await run(sb.from('bookings').update({status:s}).eq('id',id)))refresh()}
async function pay(id){const b=D.bk.find(x=>x.id===id),a=+prompt('Amount received',b.price-paid(id));if(!a)return;const m=prompt('Method: cash / bank / card / other','cash');if(!['cash','bank','card','other'].includes(m))return toast('Invalid method');ins('payments',{booking_id:id,amount:a,method:m})}
function bl(){const t0=day0(),q=bq.toLowerCase(),f=b=>{const t=+new Date(b.starts_at);return bf==='all'||(bf==='today'?t>=t0&&t<t0+864e5:bf==='upcoming'?t>=t0+864e5:b.status===bf)};
 const L=D.bk.filter(b=>f(b)&&(!q||(b.customer_name+b.customer_phone+b.ref).toLowerCase().includes(q)));return L.map(bcard).join('')||'<div class="card mu">No bookings found.</div>'}
function bookings(){return head('Bookings','Manage')+`<details><summary>${ic('plus')} Walk-in customer</summary><div><input id="wn" placeholder="Customer name"><input id="wp" type="tel" placeholder="Phone">${sel('ws',D.sv.filter(s=>s.active),'Select service')}${sel('wt',D.st.filter(s=>s.active),'Any staff')}<button class="b f2" onclick="walkin()">Create booking & token</button></div></details>
<input placeholder="Search name, phone or booking ID" value="${esc(bq)}" oninput="bq=this.value;$('#bl').innerHTML=bl()"><div class="chips">${['all','today','upcoming','confirmed','checked_in','completed','cancelled'].map(x=>`<button class="chip ${bf===x?'on':''}" onclick="bf='${x}';render()">${x.replace('_','-')}</button>`).join('')}</div><div id="bl">${bl()}</div>`}
async function walkin(){const v=$('#ws').value;if(!v)return toast('Select a service');
 const t=await run(sb.rpc('public_book',{p_slug:SAL.slug,p_service:v,p_staff:$('#wt').value||null,p_start:new Date().toISOString(),p_name:$('#wn').value,p_phone:$('#wp').value}));if(t){toast('Token #'+t.token_no+' · '+t.ref);refresh()}}

/* ===== scanner ===== */
async function scanOpen(){scanClose();const o=document.createElement('div');o.id='scan';o.innerHTML=`<div class="sc"><div class="row"><h3>Scan customer QR</h3><button class="ib" onclick="scanClose()">${ic('x')}</button></div><video id="vd" playsinline muted></video><small>Point the camera at the customer's QR, or paste the ticket link / booking ID.</small><input id="cd" placeholder="Ticket link or booking ID (B-XXXXXXXX)"><button class="b f2" onclick="found($('#cd').value)">Find booking</button></div>`;document.body.appendChild(o);
 try{if(!('BarcodeDetector' in window))throw 0;const dt=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vd');v.srcObject=stream;await v.play();tm=setInterval(async()=>{try{const r=await dt.detect(v);if(r.length)found(r[0].rawValue)}catch(e){}},400)}catch(e){const v=$('#vd');if(v)v.remove()}}
function scanClose(){clearInterval(tm);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const o=$('#scan');if(o)o.remove()}
async function found(c){c=String(c).trim();if(!c)return;clearInterval(tm);const bySecret=c.includes('#/t/'),v=bySecret?c.split('#/t/').pop():c.toUpperCase();
 const r=await sb.from('bookings').select('ref').eq('salon_id',SAL.id).eq(bySecret?'secret':'ref',v).maybeSingle();
 if(r.error||!r.data){toast('Booking not found for this salon. Scan again.');return}
 scanClose();tab='bk';bf='all';bq=r.data.ref;refresh()}

/* ===== services / staff ===== */
function manage(){const chips=`<div class="chips">${[['svc','Services'],['stf','Staff']].map(x=>`<button class="chip ${msub===x[0]?'on':''}" onclick="msub='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`,
 row=(t,id,a,left,right)=>`<div class="card"><div class="row"><span>${left}</span>${right}</div><div class="row" style="margin-top:8px"><button class="b s gh" onclick="upd('${t}','${id}',{active:${!a}})">${a?'Active':'Hidden'}</button><button class="lk" onclick="del('${t}','${id}')">${ic('trash')}</button></div></div>`;
 if(msub==='svc')return head('Services','Menu & prices')+chips+`<div class="card" style="margin-top:0"><input id="sn" placeholder="Service name"><input id="sc" placeholder="Category (Haircut, Facial...)"><div class="g2" style="margin-top:0"><input id="sp" type="number" placeholder="Price"><input id="sd" type="number" placeholder="Minutes" value="30"></div><button class="b f2" onclick="addSv()">${ic('plus')} Add service</button></div>`+D.sv.map(s=>row('services',s.id,s.active,`<b>${esc(s.name)}</b><small style="display:block">${esc(s.category)} · ${s.duration_min} min</small>`,`<input type="number" value="${s.price}" style="width:90px;margin:0" onchange="upd('services','${s.id}',{price:+this.value})">`)).join('');
 return head('Staff','Team')+chips+`<div class="card" style="margin-top:0"><input id="tn" placeholder="Name"><input id="tt" placeholder="Job title (Barber, Stylist...)"><input id="tc" type="number" placeholder="Commission %"><button class="b f2" onclick="addSt()">${ic('plus')} Add staff</button></div>`+D.st.map(s=>row('staff',s.id,s.active,`<b>${esc(s.name)}</b><small style="display:block">${esc(s.title||'')} · ${s.commission_pct}% commission</small>`,'')).join('')}
function addSv(){const n=$('#sn').value.trim(),p=$('#sp').value;if(!n||p==='')return toast('Name and price are required');ins('services',{name:n,category:$('#sc').value.trim()||'Other',price:+p,duration_min:+$('#sd').value||30})}
function addSt(){const n=$('#tn').value.trim();if(!n)return toast('Name is required');ins('staff',{name:n,title:$('#tt').value.trim(),commission_pct:+$('#tc').value||0})}

/* ===== money: payments, expenses, poster, settings ===== */
function poster(){const u=base()+'#/s/'+SAL.slug,m=qm(u,QRL.L.L),w=m.n+8,s=170/w,wp=SAL.whatsapp||SAL.phone||'';
 return `<svg id="pst" class="pst" xmlns="http://www.w3.org/2000/svg" width="320" height="450" viewBox="0 0 320 450" font-family="Arial,sans-serif"><rect width="320" height="450" rx="22" fill="#0b3d2e"/><text x="160" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">${esc(SAL.name.toUpperCase().slice(0,24))}</text><text x="160" y="90" text-anchor="middle" font-size="15" fill="#e3b873">SCAN TO BOOK APPOINTMENT</text><rect x="60" y="110" width="200" height="200" rx="14" fill="#fff"/><g transform="translate(75 125) scale(${s})"><path transform="translate(4 4)" d="${m.d}" fill="#000"/></g><text x="160" y="345" text-anchor="middle" font-size="9" fill="#fff">${esc(u.slice(0,60))}</text>${wp?`<text x="160" y="380" text-anchor="middle" font-size="14" fill="#e3b873">WhatsApp: ${esc(wp)}</text>`:''}</svg>`}
function dlPng(){const x=new XMLSerializer().serializeToString($('#pst')),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=960;c.height=1350;c.getContext('2d').drawImage(im,0,0,960,1350);c.toBlob(b=>dl(b,'salon-qr-poster.png'))};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)}
function money(){const chips=`<div class="chips">${[['pay','Payments'],['exp','Expenses'],['qr','QR poster'],['set','Settings']].map(x=>`<button class="chip ${sub===x[0]?'on':''}" onclick="sub='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`,m0=mon0();
 if(sub==='pay')return head('Payments','Money in')+hero('hg','Month revenue',rs(sum(D.py.filter(p=>+new Date(p.created_at)>=m0).map(net))),'Record payments from the Bookings tab')+chips+(D.py.map(prow).join('')||'<div class="card mu">No payments yet.</div>');
 if(sub==='exp')return head('Expenses','Money out')+hero('hb','This month',rs(sum(D.ex.filter(e=>e.spent_on>=iso(m0)).map(e=>+e.amount))))+chips+`<div class="card" style="margin-top:0"><input id="et" placeholder="Title (e.g. Shop rent)"><select id="ec">${['Rent','Electricity','Water','Products','Salaries','Equipment','Maintenance','Marketing','Other'].map(x=>`<option>${x}</option>`).join('')}</select><div class="g2" style="margin-top:0"><input id="ea" type="number" placeholder="Amount"><input id="ed" type="date" value="${iso(Date.now())}"></div><button class="b f2" onclick="addEx()">${ic('plus')} Add expense</button></div>`+D.ex.map(e=>`<div class="card row"><div><b>${esc(e.title)}</b><div class="mu">${e.spent_on} · ${esc(e.category)}</div></div><div><b class="f" style="color:var(--rd);font-size:17px">${rs(e.amount)}</b><button class="lk" onclick="del('expenses','${e.id}')">${ic('trash')}</button></div></div>`).join('');
 if(sub==='qr')return head('QR poster','Print & stick')+chips+`<div class="card">${poster()}<button class="b f2" onclick="dlPng()">${ic('down')} Download PNG</button><button class="b gh f2" onclick="window.print()">Print</button></div>`;
 return head('Settings','Salon profile')+chips+`<div class="card" style="margin-top:0"><small>Salon name</small><input id="pn" value="${esc(SAL.name)}"><small>WhatsApp number</small><input id="pw2" value="${esc(SAL.whatsapp||'')}" placeholder="03xx xxxxxxx"><small>Address</small><input id="pa" value="${esc(SAL.address||'')}"><div class="g2" style="margin-top:0"><div><small>Opens</small><input id="po" type="time" value="${SAL.open_time.slice(0,5)}"></div><div><small>Closes</small><input id="pc" type="time" value="${SAL.close_time.slice(0,5)}"></div></div><button class="b f2" onclick="saveSal()">Save</button></div><button class="b gh f2" onclick="dl(new Blob([JSON.stringify({salon:SAL,...D},null,1)],{type:'application/json'}),'salon-backup.json')">${ic('down')} Download JSON backup</button>`}
function addEx(){const t=$('#et').value.trim(),a=+$('#ea').value;if(!t||!a)return toast('Title and amount are required');ins('expenses',{title:t,category:$('#ec').value,amount:a,spent_on:$('#ed').value})}
async function saveSal(){const o={name:$('#pn').value.trim(),whatsapp:$('#pw2').value.trim(),address:$('#pa').value.trim(),open_time:$('#po').value,close_time:$('#pc').value};if(await run(sb.from('salons').update(o).eq('id',SAL.id))){Object.assign(SAL,o);toast('Saved');render()}}

/* ===== public booking page + ticket (no login) ===== */
async function pubPage(slug){SLUG=slug;U=null;view('<div class="card tc mu">Loading…</div>');pub=await run(sb.rpc('public_salon',{p_slug:slug}));
 if(!pub)return view('<div class="card tc">Salon not found.</div>');CUR=pub.currency;ps={};renderPub()}
function renderPub(){view(`<div class="top"><div></div><div class="bt">${tb()}</div></div><div class="ban"><small class="f">Welcome to</small><h1>${esc(pub.name)}</h1><small>${esc(pub.address||'')} · ${pub.open.slice(0,5)}–${pub.close.slice(0,5)}</small>${pub.phone?`<div class="lks"><a style="background:#1fa855" href="${wa(pub.phone,'Hi, I want to book at '+pub.name)}">WhatsApp</a></div>`:''}</div><h2>Choose a service</h2>
${pub.services.map(s=>`<div class="svc ${s.id===ps.svc?'on':''}" onclick="ps={svc:'${s.id}'};renderPub()"><div><b>${esc(s.name)}</b><small>${esc(s.category)} · ${s.duration_min} min</small></div><div class="p">${rs(s.price)}</div></div>`).join('')||'<div class="card mu">No services yet.</div>'}
${ps.svc?`<h2>Staff & time</h2><div class="card" style="margin-top:0"><select onchange="ps.staff=this.value;loadSlots()"><option value="">Any available staff</option>${pub.staff.map(x=>`<option value="${x.id}" ${ps.staff===x.id?'selected':''}>${esc(x.name)}${x.title?' · '+esc(x.title):''}</option>`).join('')}</select><input type="date" min="${iso(Date.now())}" value="${ps.date||''}" onchange="ps.date=this.value;loadSlots()"><div id="sl" class="chips" style="flex-wrap:wrap"><small>Pick a date to see free times</small></div></div><h2>Your details</h2><div class="card" style="margin-top:0"><input id="cn" placeholder="Your name"><input id="cp" type="tel" placeholder="Phone number"><input id="cm" placeholder="Note (optional)"><button class="b f2" onclick="confirmBk()">Confirm booking</button></div>`:''}`)}
async function loadSlots(){ps.slot=null;if(!ps.date)return;ps.sl=await run(sb.rpc('public_slots',{p_slug:SLUG,p_service:ps.svc,p_staff:ps.staff||null,p_date:ps.date}))||[];drawSlots()}
function drawSlots(){$('#sl').innerHTML=ps.sl.length?ps.sl.map(x=>`<button class="chip ${ps.slot===x.t?'on':''}" onclick="ps.slot='${x.t}';drawSlots()">${tfmt(x.t)}</button>`).join(''):'<small>No free times on this day.</small>'}
async function confirmBk(){if(!ps.slot)return toast('Pick a date and time');const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(n.length<2||p.length<7)return toast('Enter your name and phone number');
 const t=await run(sb.rpc('public_book',{p_slug:SLUG,p_service:ps.svc,p_staff:ps.staff||null,p_start:ps.slot,p_name:n,p_phone:p,p_notes:$('#cm').value||null}));if(t)location.hash='#/t/'+t.secret}
async function ticketPage(sec){U=null;const t=await run(sb.rpc('ticket_by_secret',{p_secret:sec}));if(!t)return view('<div class="card tc">Ticket not found.</div>');
 const url=base()+'#/t/'+t.secret,m=qm(url,QRL.L.L),w=m.n+8,txt=`Booking ${t.ref} at ${t.salon}\nToken #${t.token_no}\n${t.service} with ${t.staff}\n${fmt(t.starts_at)}\n${url}`;
 view(`<div class="top"><div></div><div class="bt">${tb()}</div></div><div class="card tc"><div class="sm">${esc(t.salon)}</div><div class="f tok">Token #${t.token_no}</div><div style="display:flex;justify-content:center;margin:10px 0"><svg width="200" height="200" viewBox="0 0 ${w} ${w}" shape-rendering="crispEdges" style="border-radius:12px;background:#fff"><rect width="${w}" height="${w}" fill="#fff"/><path transform="translate(4 4)" d="${m.d}"/></svg></div><b>${t.ref}</b><div class="mu">${esc(t.name)} · ${esc(t.service)} · ${esc(t.staff)}</div><div class="mu">${fmt(t.starts_at)}</div><span class="tag" style="background:${SC[t.status]}">${t.status.replace('_',' ')}</span><p class="mu">Your booking is confirmed. Please save this token or take a screenshot. Show your token or QR code when you arrive at the salon.</p>
<div class="g2"><button class="b" onclick="window.print()">Print / Save PDF</button><button class="b gh" onclick="navigator.clipboard.writeText('${t.ref}');toast('Booking ID copied')">Copy ID</button></div><a class="b bl f2" target="_blank" href="${wa('',txt)}">Share on WhatsApp</a>${t.phone?`<a class="b gh f2" target="_blank" href="${wa(t.phone,'Hi, about booking '+t.ref)}">Contact salon</a>`:''}</div>`)}

route();

</script></body></html>
